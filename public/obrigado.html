<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interesse recebido | Rede Ypê Combustíveis</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121315">
<link rel="icon" href="img/icones/icone-192.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Barlow:wght@400;600&display=swap">
<style>
/* Página de chegada do formulário quando o navegador envia sem JavaScript. */
:root { --bg: #121315; --tinta: #F5F4F0; --cinza: #B5B6B8; --amarelo: #FFD000; }
* { box-sizing: border-box; }
::selection { background: var(--amarelo); color: #121314; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--tinta); font: 400 1.0625rem/1.6 "Barlow", "Segoe UI", system-ui, sans-serif; }
main { max-width: 34rem; display: grid; gap: 18px; justify-items: start; }
.logo { display: block; padding: 6px 10px; border-radius: 6px; background: var(--amarelo); }
.logo img { display: block; height: 32px; width: auto; }
h1 { margin: 12px 0 0; font: 800 clamp(1.9rem, 6vw, 2.6rem)/1.1 "Archivo", sans-serif; text-wrap: balance; }
p { margin: 0; color: var(--cinza); }
a.voltar { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 24px; border-radius: 999px; background: var(--amarelo); color: #121314; font-weight: 600; text-decoration: none; }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <a class="logo" href="./"><img src="img/marca/rede-ype-preto-120.png" alt="Rede Ypê Combustíveis, página inicial" width="369" height="120"></a>
  <h1>Recebemos o seu interesse.</h1>
  <p>A equipe da Rede Ypê vai entrar em contato pelo e-mail ou telefone que você informou. Se preferir adiantar a conversa, chame a central pelo (12) 97409-6149.</p>
  <a class="voltar" href="./#lojistas">Voltar ao site</a>
</main>
</body>
</html>
